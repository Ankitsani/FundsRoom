version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fundsroom-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fundsroom_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fundsroom-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fundsroom_erp?schema=public
      - JWT_SECRET=super-secret-jwt-key-replace-in-production
    depends_on:
      - postgres
    restart: unless-stopped
    # Sleep to allow postgres database initialization before push and seed
    command: >
      sh -c "sleep 3 && npx prisma db push --accept-data-loss && npx prisma db seed && npm start"

  frontend:
    build: ./frontend
    container_name: fundsroom-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
